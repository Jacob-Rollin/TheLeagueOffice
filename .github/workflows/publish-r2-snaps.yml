name: Publish R2 Research Snaps

# Pulls warm research/snap JSON from the live app and uploads to Cloudflare R2.
# Browse then reads R2 directly (free egress) instead of TiDB via Vercel.
#
# Requires GitHub secrets:
#   APP_URL, CRON_SECRET (existing)
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET, R2_PUBLIC_BASE

on:
  schedule:
    # After research-aggregates (08:15) and Vercel 07:00 backup.
    - cron: "45 8 * * *"
    # Evening gameday refresh (after research 19:15).
    - cron: "45 19 * * 0,1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-r2-snaps
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: creds
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          missing=0
          for v in APP_URL CRON_SECRET R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -z "${!v}" ]; then
              echo "::warning::$v not configured — skipping R2 publish."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch NFL week
        if: steps.creds.outputs.available == 'true'
        id: week
        run: |
          WEEK=$(curl -fsSL "https://api.sleeper.app/v1/state/nfl" | python3 -c "import sys,json; print(max(1,int(json.load(sys.stdin).get('week') or 1)))")
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "NFL week=$WEEK"

      - name: Download warm snaps
        if: steps.creds.outputs.available == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          BASE="${APP_URL%/}"
          case "$BASE" in
            http://theleagueoffice.app|https://theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
            http://www.theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
          esac
          mkdir -p out/research out/snap
          AUTH=(-H "Authorization: Bearer $CRON_SECRET" -H "accept: application/json")

          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL "${AUTH[@]}" "$url" -o "$dest"; then
              # Reject empty / error JSON shells so we do not publish cold misses.
              python3 - "$dest" <<'PY'
import json,sys
p=sys.argv[1]
with open(p) as f: d=json.load(f)
if isinstance(d, dict) and d.get("ok") is False:
  raise SystemExit(f"error payload {p}")
print("ok", p)
PY
            else
              echo "warn: miss $url"
              rm -f "$dest"
            fi
          }

          for fmt in std half ppr; do
            fetch "$BASE/api/data/research/fpa?format=$fmt" "out/research/fpa-$fmt.json"
            fetch "$BASE/api/data/research/sos-analysis?format=$fmt" "out/research/sos-analysis-$fmt.json"
            fetch "$BASE/api/data/snap/trade-market?format=$fmt" "out/snap/trade-market-$fmt.json"
            fetch "$BASE/api/data/research/matchups-guide?week=$WEEK&format=$fmt" \
              "out/research/matchups-guide-w${WEEK}-$fmt.json"
          done

          fetch "$BASE/api/data/research/fantasy-leaders" out/research/fantasy-leaders.json
          fetch "$BASE/api/data/research/sos-board" out/research/sos-board.json
          fetch "$BASE/api/data/research/targets" out/research/targets.json
          fetch "$BASE/api/data/research/are-they-playing?week=$WEEK" \
            "out/research/are-they-playing-w${WEEK}.json"

          for yl in 5 10 15 20; do
            fetch "$BASE/api/data/research/redzone?yardline=$yl" "out/research/redzone-$yl.json"
          done

          fetch "$BASE/api/data/snap/injury-reports" out/snap/injury-reports.json
          fetch "$BASE/api/data/snap/fantasy-news?limit=80" out/snap/fantasy-news.json
          fetch "$BASE/api/data/snap/trade-basis" out/snap/trade-basis.json

          echo "Downloaded:"
          find out -type f -name '*.json' | sort

      - name: Upload to Cloudflare R2
        if: steps.creds.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Research/snaps refresh on cron — 1h browser, long edge via CF if proxied.
          CACHE="public, max-age=300, s-maxage=3600, stale-while-revalidate=86400"

          upload_dir() {
            local dir="$1" prefix="$2"
            if [ ! -d "$dir" ]; then return 0; fi
            for f in "$dir"/*.json; do
              [ -f "$f" ] || continue
              key="${prefix}/$(basename "$f")"
              aws s3 cp "$f" "s3://${R2_BUCKET}/${key}" \
                --endpoint-url "$ENDPOINT" \
                --content-type "application/json; charset=utf-8" \
                --cache-control "$CACHE" \
                --no-progress
              echo "uploaded $key"
            done
          }

          upload_dir out/research research
          upload_dir out/snap snap

          if [ -n "${R2_PUBLIC_BASE:-}" ]; then
            echo "Public base: ${R2_PUBLIC_BASE%/}/research/fpa-half.json"
          fi
