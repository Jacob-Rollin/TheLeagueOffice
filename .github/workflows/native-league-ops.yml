name: Native League Ops

# Waivers / trade veto / TiDB point snaps / weekly standings / AI managers.
# Live Matchup scores use snap-cdn (native-live-week-stats.yml) — not this workflow.
# Requires APP_URL + CRON_SECRET.

on:
  schedule:
    # Waivers: Wed 10:00 America/New_York ≈ 14:00 UTC.
    - cron: "0 14 * * 3"
    # Trade veto settle: every 2h.
    - cron: "20 */2 * * *"
    # TiDB week point snaps only (not W–L): daily catch-up. Live UI does not depend on this.
    - cron: "40 7 * * *"
    # Standings W–L finalize after MNF: Tue 10:00 America/New_York ≈ 14:00 UTC.
    - cron: "0 14 * * 2"
    # AI draft/lineup tick (Tue–Wed mornings + Thu pre-kickoff).
    - cron: "15 15 * * 2,3,4"
  workflow_dispatch:
    inputs:
      mode:
        description: "waivers | points | standings | ai | both | all"
        type: choice
        options: [both, waivers, points, standings, ai, all]
        default: both

permissions:
  contents: read

concurrency:
  group: native-league-ops
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger native league cron endpoints
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode || 'both' }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          BASE="${APP_URL%/}"
          AUTH="Authorization: Bearer ${CRON_SECRET}"

          run_waivers() {
            echo "GET ${BASE}/api/cron/native-waivers"
            curl -fsS -H "$AUTH" "${BASE}/api/cron/native-waivers?limit=20" | head -c 2000
            echo
          }
          run_points() {
            echo "GET ${BASE}/api/cron/native-scoring?mode=points"
            curl -fsS -H "$AUTH" "${BASE}/api/cron/native-scoring?mode=points&limit=15" | head -c 2000
            echo
          }
          run_standings() {
            echo "GET ${BASE}/api/cron/native-scoring?mode=standings"
            curl -fsS -H "$AUTH" "${BASE}/api/cron/native-scoring?mode=standings&limit=15" | head -c 2000
            echo
          }
          run_ai() {
            echo "GET ${BASE}/api/cron/native-ai"
            curl -fsS -H "$AUTH" "${BASE}/api/cron/native-ai?limit=12" | head -c 2000
            echo
          }

          if [ "$SCHEDULE" = "20 */2 * * *" ]; then
            run_waivers
            exit 0
          fi
          if [ "$SCHEDULE" = "15 15 * * 2,3,4" ]; then
            run_ai
            exit 0
          fi
          if [ "$SCHEDULE" = "40 7 * * *" ]; then
            run_points
            exit 0
          fi
          if [ "$SCHEDULE" = "0 14 * * 2" ]; then
            run_standings
            exit 0
          fi
          if [ "$SCHEDULE" = "0 14 * * 3" ]; then
            run_waivers
            exit 0
          fi

          case "$MODE" in
            waivers) run_waivers ;;
            points) run_points ;;
            standings) run_standings ;;
            ai) run_ai ;;
            all) run_waivers; run_points; run_standings; run_ai ;;
            *) run_waivers; run_points ;;
          esac
