name: Publish Snap CDN

# Pulls warm research/snap JSON from the live app and force-pushes an orphan
# `snap-cdn` branch. Browsers read via raw.githubusercontent.com (no card,
# free for a public repo) instead of TiDB via Vercel Fluid.
#
# Requires: APP_URL + CRON_SECRET (existing). No R2 / Cloudflare secrets.

on:
  schedule:
    # After research-aggregates (08:15) and Vercel 07:00 backup.
    - cron: "45 8 * * *"
    # Evening gameday refresh (after research 19:15).
    - cron: "45 19 * * 0,1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: publish-snap-cdn
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check secrets
        id: creds
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0
          for v in APP_URL CRON_SECRET; do
            if [ -z "${!v}" ]; then
              echo "::warning::$v not configured — skipping snap CDN publish."
              missing=1
            fi
          done
          if [ "$missing" = "1" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch NFL week
        if: steps.creds.outputs.available == 'true'
        id: week
        run: |
          WEEK=$(curl -fsSL "https://api.sleeper.app/v1/state/nfl" | python3 -c "import sys,json; print(max(1,int(json.load(sys.stdin).get('week') or 1)))")
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "NFL week=$WEEK"

      - name: Download warm snaps
        if: steps.creds.outputs.available == 'true'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          set -euo pipefail
          BASE="${APP_URL%/}"
          case "$BASE" in
            http://theleagueoffice.app|https://theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
            http://www.theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
          esac
          mkdir -p out/research out/snap
          AUTH=(-H "Authorization: Bearer $CRON_SECRET" -H "accept: application/json")

          fetch() {
            local url="$1" dest="$2"
            if curl -fsSL "${AUTH[@]}" "$url" -o "$dest"; then
              python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); assert not (isinstance(d, dict) and d.get("ok") is False), f"error payload {p}"; print("ok", p)' "$dest"
            else
              echo "warn: miss $url"
              rm -f "$dest"
            fi
          }

          for fmt in std half ppr; do
            fetch "$BASE/api/data/research/fpa?format=$fmt" "out/research/fpa-$fmt.json"
            fetch "$BASE/api/data/research/sos-analysis?format=$fmt" "out/research/sos-analysis-$fmt.json"
            fetch "$BASE/api/data/snap/trade-market?format=$fmt" "out/snap/trade-market-$fmt.json"
            fetch "$BASE/api/data/research/matchups-guide?week=$WEEK&format=$fmt" \
              "out/research/matchups-guide-w${WEEK}-$fmt.json"
          done

          fetch "$BASE/api/data/research/fantasy-leaders" out/research/fantasy-leaders.json
          fetch "$BASE/api/data/research/sos-board" out/research/sos-board.json
          fetch "$BASE/api/data/research/targets" out/research/targets.json
          mkdir -p out/research/are-they-playing
          fetch "$BASE/api/data/research/are-they-playing?week=$WEEK" \
            "out/research/are-they-playing/week-${WEEK}.json"

          for yl in 5 10 15 20; do
            fetch "$BASE/api/data/research/redzone?yardline=$yl" "out/research/redzone-$yl.json"
          done

          fetch "$BASE/api/data/snap/injury-reports" out/snap/injury-reports.json
          # Homepage InjuryWire — compute allowed via CRON_SECRET on this fetch.
          fetch "$BASE/api/data/snap/injury-wire?limit=8" out/snap/injury-wire.json
          fetch "$BASE/api/data/snap/fantasy-news?limit=80" out/snap/fantasy-news.json
          fetch "$BASE/api/data/snap/trade-basis" out/snap/trade-basis.json
          # Player-brain warehouse — browse reads snap-cdn instead of Vercel /api/data/players-export.
          fetch "$BASE/api/data/players-export" out/snap/players-export.json

          # Native Matchup live overlay — Sleeper week stats (no Vercel; Actions → Sleeper).
          # Also refreshed more often by native-live-week-stats.yml on gamedays.
          SEASON=$(curl -fsSL "https://api.sleeper.app/v1/state/nfl" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('league_season') or d.get('season') or '')")
          if [ -n "$SEASON" ]; then
            POS="position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF"
            if curl -fsSL "https://api.sleeper.app/v1/stats/nfl/${SEASON}/${WEEK}?season_type=regular&${POS}" -o /tmp/native-week-raw.json; then
              python3 <<PY
          import json, datetime
          from pathlib import Path
          season, week = "${SEASON}", int("${WEEK}")
          raw = json.load(open("/tmp/native-week-raw.json"))
          stats = {}
          if isinstance(raw, list):
              for row in raw:
                  pid = str((row or {}).get("player_id") or "").strip()
                  st = (row or {}).get("stats") or {}
                  if pid and isinstance(st, dict):
                      stats[pid] = {k: float(v) for k, v in st.items() if isinstance(v, (int, float))}
          elif isinstance(raw, dict):
              for pid, row in raw.items():
                  st = (row or {}).get("stats") if isinstance(row, dict) else None
                  if isinstance(st, dict):
                      stats[str(pid)] = {k: float(v) for k, v in st.items() if isinstance(v, (int, float))}
          if stats:
              Path(f"out/snap/native-week-stats-{season}-w{week}.json").write_text(
                  json.dumps({
                      "season": int(season) if str(season).isdigit() else season,
                      "week": week,
                      "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                      "stats": stats,
                  }, separators=(",", ":"))
              )
              print("ok native week stats", season, week, len(stats))
          PY
            fi

            # Mobile Team tab offense ranks — also owned by nfl-team-offense-ranks.yml.
            # Rebuild here so orphan publish never drops the file if the sidecar ran first
            # (or restore after a wipe). Soft-skip on ESPN failure; preserve step keeps stale.
            python3 <<PY || echo "warn: nfl-team-offense-ranks miss"
          import datetime, json, re, time, urllib.request
          from pathlib import Path

          UA = {"accept": "application/json", "user-agent": "TheLeagueOffice-snap/1.0"}
          ABBR_FIX = {"WSH": "WAS"}
          FIELDS = [
              ("offense", "passing", "netTotalYards"),
              ("passAtt", "passing", "passingAttempts"),
              ("passYd", "passing", "netPassingYards"),
              ("passTd", "passing", "passingTouchdowns"),
              ("td", "scoring", "totalTouchdowns"),
              ("rz", "miscellaneous", "redzoneScoringPct"),
              ("rzPct", "miscellaneous", "redzoneTouchdownPct"),
          ]

          def get(url: str):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          def parse_rank(stat):
              raw = stat.get("rank")
              if isinstance(raw, (int, float)) and raw > 0:
                  return int(raw)
              m = re.search(r"(\d+)", str(stat.get("rankDisplayValue") or ""))
              return int(m.group(1)) if m else None

          def pick_stat(categories, category, name):
              for cat in categories:
                  if str(cat.get("name") or "") != category:
                      continue
                  for st in cat.get("stats") or []:
                      if str(st.get("name") or "") == name:
                          return st
              return None

          season = "${SEASON}"
          teams_payload = get("https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams?limit=50")
          team_rows = (
              teams_payload.get("sports", [{}])[0]
              .get("leagues", [{}])[0]
              .get("teams", [])
          )
          teams = []
          for row in team_rows:
              tm = row.get("team") or {}
              tid = str(tm.get("id") or "").strip()
              abbr = str(tm.get("abbreviation") or "").strip().upper()
              if tid and abbr:
                  teams.append((tid, ABBR_FIX.get(abbr, abbr)))
          if len(teams) < 30:
              raise SystemExit(f"expected ~32 ESPN teams, got {len(teams)}")

          out_teams = {}
          for i, (tid, abbr) in enumerate(teams):
              url = (
                  "https://sports.core.api.espn.com/v2/sports/football/leagues/nfl/"
                  f"seasons/{season}/types/2/teams/{tid}/statistics"
              )
              try:
                  payload = get(url)
              except Exception as exc:
                  print(f"skip {abbr}: {exc}")
                  time.sleep(0.15)
                  continue
              cats = ((payload.get("splits") or {}).get("categories")) or []
              ranks = {}
              for key, cat, name in FIELDS:
                  st = pick_stat(cats, cat, name)
                  rank = parse_rank(st) if st else None
                  if rank is not None:
                      ranks[key] = rank
              if ranks:
                  out_teams[abbr] = ranks
              if i < len(teams) - 1:
                  time.sleep(0.12)

          if len(out_teams) < 28:
              raise SystemExit(f"too few team rank rows: {len(out_teams)}")

          Path(f"out/snap/nfl-team-offense-ranks-{season}.json").write_text(
              json.dumps({
                  "season": int(season) if str(season).isdigit() else season,
                  "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                  "source": "espn-team-season-stats",
                  "teams": out_teams,
              }, separators=(",", ":"))
          )
          print("ok nfl-team-offense-ranks", season, len(out_teams))
          PY
          fi

          # Mobile Team tab depth chart — Sleeper depth_chart_position + order.
          # One Actions download of /v1/players/nfl; visitors never hit that endpoint.
          python3 <<'PY' || echo "warn: nfl-team-depth miss"
          import datetime, json, urllib.request
          from pathlib import Path

          UA = {"accept": "application/json", "user-agent": "TheLeagueOffice-snap/1.0"}
          WR_SLOT = {"LWR": "WR1", "RWR": "WR2", "SWR": "WR3"}
          POS_OK = {"QB", "RB", "WR", "TE", "K"}

          def get(url: str):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=120) as res:
                  return json.load(res)

          raw = get("https://api.sleeper.app/v1/players/nfl")
          teams = {}
          for pid, p in (raw or {}).items():
              if not isinstance(p, dict):
                  continue
              pos = str(p.get("position") or "").upper()
              team = str(p.get("team") or "").strip().upper()
              order = p.get("depth_chart_order")
              status = p.get("status")
              if not team or team == "FA" or pos not in POS_OK:
                  continue
              if status != "Active" or not isinstance(order, (int, float)):
                  continue
              depth_pos = str(p.get("depth_chart_position") or "").strip().upper() or None
              if pos == "WR":
                  slot = WR_SLOT.get(depth_pos or "")
                  if not slot:
                      continue
              else:
                  slot = pos
              name = (p.get("full_name") or f"{p.get('first_name') or ''} {p.get('last_name') or ''}").strip()
              if not name:
                  continue
              chart = teams.setdefault(team, {})
              chart.setdefault(slot, []).append({
                  "id": str(pid),
                  "name": name,
                  "order": int(order),
                  "injury": p.get("injury_status") or None,
              })

          for chart in teams.values():
              for slot, rows in chart.items():
                  rows.sort(key=lambda r: (r["order"], r["name"]))
                  chart[slot] = rows[:3]

          if len(teams) < 28:
              raise SystemExit(f"too few team depth charts: {len(teams)}")

          Path("out/snap/nfl-team-depth.json").write_text(
              json.dumps({
                  "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
                  "source": "sleeper-players-depth",
                  "teams": teams,
              }, separators=(",", ":"))
          )
          print("ok nfl-team-depth", len(teams))
          PY

          count=$(find out -type f -name '*.json' | wc -l | tr -d ' ')
          echo "Downloaded $count JSON files"
          if [ "$count" = "0" ]; then
            echo "::error::No snaps downloaded — aborting publish."
            exit 1
          fi
          find out -type f -name '*.json' | sort

      - name: Force-push orphan snap-cdn branch
        if: steps.creds.outputs.available == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          WORK=$(mktemp -d)

          # Seed from the previous tip so sidecar snaps from other workflows survive
          # this orphan force-push (e.g. nfl-team-offense-ranks-*.json from
          # nfl-team-offense-ranks.yml, prior native-week-stats weeks). Fresh
          # downloads in out/ overlay and win on conflict; soft-misses keep stale.
          if git ls-remote --exit-code --heads "$REMOTE" snap-cdn >/dev/null 2>&1; then
            PREV=$(mktemp -d)
            (
              cd "$PREV"
              git init -q
              git fetch --depth=1 "$REMOTE" snap-cdn
              git archive --format=tar FETCH_HEAD | tar -x -C "$WORK"
            )
            echo "Seeded previous snap-cdn tip into publish tree"
          fi

          cp -a out/. "$WORK/"
          # Marker so GitHub Pages (optional) serves JSON as-is.
          touch "$WORK/.nojekyll"
          {
            echo "# Snap CDN (generated)"
            echo
            echo "Auto-published research/snap JSON for The League Office browse path."
            echo "Do not edit by hand — overwritten by **Publish Snap CDN** Actions."
            echo
            echo "Public base (recommended):"
            echo
            echo "\`https://raw.githubusercontent.com/${REPO}/snap-cdn\`"
            echo
            echo "Example: \`…/research/fpa-half.json\`"
          } > "$WORK/README.md"

          cd "$WORK"
          git init -q
          git checkout -q -b snap-cdn
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish research/snap CDN $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "$REMOTE" snap-cdn

          BASE="https://raw.githubusercontent.com/${REPO}/snap-cdn"
          echo "Public base: $BASE"
          echo "Smoke: ${BASE}/research/fpa-half.json"
          ls -la snap/nfl-team-offense-ranks-*.json 2>/dev/null || echo "note: no nfl-team-offense-ranks yet (run NFL Team Offense Ranks workflow)"
          ls -la snap/nfl-team-depth.json 2>/dev/null || echo "note: no nfl-team-depth yet"
