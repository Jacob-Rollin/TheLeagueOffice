name: Native Live Week Stats

# Publishes Sleeper week actuals to snap-cdn for native Matchup live overlay.
# Fetches Sleeper from Actions (one shared download) — no Vercel Fluid.
# Updates one JSON file on the existing snap-cdn branch (preserves research snaps).
#
# Cadence (D3): cron still ticks every 5m on gameday windows so we catch kickoffs
# quickly, but the job only publishes when:
#   - a game is live (ESPN scoreboard state === "in"), or
#   - the existing snap is missing / older than ~20 minutes (idle catch-up), or
#   - workflow_dispatch (manual).
# Browser live scoring still prefers direct Sleeper; this snap is soft fallback.

on:
  schedule:
    # Gameday afternoons/evenings UTC (Thu–Mon): every 5 minutes (gated in-job).
    - cron: "*/5 16-23 * * 0,1,4,5,6"
    - cron: "*/5 0-5 * * 0,1"
    # Midday catch-up Sun/Mon.
    - cron: "0 12-15 * * 0,1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: native-live-week-stats
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build native week-stats JSON from Sleeper
        id: build
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Idle (no live games) republish floor — keeps snap warm without */5 pushes.
          IDLE_MAX_AGE_SEC: "1200"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, os, urllib.error, urllib.request
          from pathlib import Path

          def github_out(key: str, value: str) -> None:
              out = os.environ.get("GITHUB_OUTPUT")
              if not out:
                  return
              with open(out, "a", encoding="utf-8") as fh:
                  fh.write(f"{key}={value}\n")

          def fetch_json(url: str, timeout: int = 25):
              req = urllib.request.Request(url, headers={"accept": "application/json", "user-agent": "tlo-native-live-week-stats"})
              with urllib.request.urlopen(req, timeout=timeout) as res:
                  return json.load(res)

          def scoreboard_has_live() -> bool:
              try:
                  board = fetch_json(
                      "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard"
                  )
              except Exception as err:
                  print(f"scoreboard check failed (assume live to stay fresh): {err}")
                  return True
              events = board.get("events") if isinstance(board, dict) else None
              if not isinstance(events, list):
                  return True
              for ev in events:
                  if not isinstance(ev, dict):
                      continue
                  comps = ev.get("competitions")
                  state = ""
                  if isinstance(comps, list) and comps and isinstance(comps[0], dict):
                      state = str(
                          ((comps[0].get("status") or {}).get("type") or {}).get("state") or ""
                      )
                  if not state:
                      state = str(((ev.get("status") or {}).get("type") or {}).get("state") or "")
                  if state.lower() == "in":
                      return True
              return False

          def snap_age_sec(season: str, week: int) -> float | None:
              """Age of existing snap-cdn tip, or None if missing/unreadable."""
              repo = os.environ.get("GITHUB_REPOSITORY", "").strip()
              if not repo:
                  return None
              raw = (
                  f"https://raw.githubusercontent.com/{repo}/snap-cdn/"
                  f"snap/native-week-stats-{season}-w{week}.json"
              )
              try:
                  payload = fetch_json(raw, timeout=15)
              except Exception as err:
                  print(f"existing snap miss/unreadable: {err}")
                  return None
              updated = str((payload or {}).get("updatedAt") or "").strip()
              if not updated:
                  return None
              try:
                  # Accept …Z or +00:00
                  ts = datetime.datetime.fromisoformat(updated.replace("Z", "+00:00"))
              except ValueError:
                  return None
              now = datetime.datetime.now(datetime.timezone.utc)
              if ts.tzinfo is None:
                  ts = ts.replace(tzinfo=datetime.timezone.utc)
              return max(0.0, (now - ts).total_seconds())

          state = fetch_json("https://api.sleeper.app/v1/state/nfl")
          season = str(state.get("league_season") or state.get("season") or datetime.datetime.utcnow().year)
          week = max(1, int(state.get("week") or 1))

          force = os.environ.get("GITHUB_EVENT_NAME", "") == "workflow_dispatch"
          live = scoreboard_has_live()
          idle_max = max(60, int(os.environ.get("IDLE_MAX_AGE_SEC", "1200") or "1200"))
          age = None if force or live else snap_age_sec(season, week)

          if not force and not live and age is not None and age < idle_max:
              print(
                  f"skip publish: no live games; snap age {int(age)}s < idle floor {idle_max}s "
                  f"(season={season} week={week})"
              )
              github_out("skip", "true")
              raise SystemExit(0)

          reason = (
              "workflow_dispatch"
              if force
              else "live_game"
              if live
              else "idle_stale_or_missing"
          )
          print(f"publishing reason={reason} season={season} week={week} live={live} age={age}")

          pos = "&".join(f"position[]={p}" for p in ("QB", "RB", "WR", "TE", "K", "DEF"))
          # Must use /regular/{season}/{week} — query-string season_type returns empty {} rows.
          url = f"https://api.sleeper.app/v1/stats/nfl/regular/{season}/{week}?{pos}"
          raw = fetch_json(url)
          SKIP_KEYS = {"stats", "player_id", "player", "team", "opponent"}

          def coerce_line(row):
              if not isinstance(row, dict):
                  return None
              nested = row.get("stats")
              source = nested if isinstance(nested, dict) else row
              out = {
                  k: float(v)
                  for k, v in source.items()
                  if k not in SKIP_KEYS and isinstance(v, (int, float))
              }
              return out or None

          stats = {}
          if isinstance(raw, list):
              for row in raw:
                  pid = str((row or {}).get("player_id") or "").strip()
                  st = coerce_line(row)
                  if not pid or not st:
                      continue
                  stats[pid] = st
          elif isinstance(raw, dict):
              for pid, row in raw.items():
                  st = coerce_line(row)
                  if not st:
                      continue
                  stats[str(pid)] = st
          if not stats:
              raise SystemExit("empty week stats from Sleeper")
          payload = {
              "season": int(season) if str(season).isdigit() else season,
              "week": week,
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "stats": stats,
          }
          Path("/tmp/native-week-stats.json").write_text(json.dumps(payload, separators=(",", ":")))
          Path("/tmp/native-week-meta.env").write_text(f"SEASON={season}\nWEEK={week}\n")
          github_out("skip", "false")
          github_out("season", season)
          github_out("week", str(week))
          print(f"season={season} week={week} players={len(stats)}")
          PY

      - name: Update snap-cdn file
        if: steps.build.outputs.skip != 'true'
        env:
          SEASON: ${{ steps.build.outputs.season }}
          WEEK: ${{ steps.build.outputs.week }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          DEST="snap/native-week-stats-${SEASON}-w${WEEK}.json"
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" snap-cdn >/dev/null 2>&1; then
            git fetch --depth=1 "$REMOTE" snap-cdn
            git checkout -q FETCH_HEAD
            git checkout -q -B snap-cdn
          else
            git checkout -q -b snap-cdn
            touch .nojekyll
            echo "# Snap CDN" > README.md
          fi
          mkdir -p snap
          cp /tmp/native-week-stats.json "$DEST"
          git add -A
          if git diff --cached --quiet; then
            echo "No content change — skip push."
            exit 0
          fi
          git commit -q -m "Native live week stats ${SEASON} w${WEEK} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "$REMOTE" snap-cdn
          echo "Published ${DEST}"
