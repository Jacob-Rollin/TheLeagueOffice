name: NFL Team Offense Ranks

# Publishes Sleeper TEAM_* season offense ranks to snap-cdn for the mobile
# player Team tab. One Actions pull of season stats — visitors only hit GitHub
# raw once. No Vercel Fluid / TiDB / visitor Sleeper budget / ESPN fan-out.

on:
  schedule:
    # Season ranks move slowly — a few times per day is enough.
    - cron: "20 7,13,19,1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nfl-team-offense-ranks
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build team offense ranks from Sleeper TEAM_* stats
        id: build
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime, json, urllib.request
          from pathlib import Path

          UA = {"accept": "application/json", "user-agent": "TheLeagueOffice-snap/1.0"}
          # Chip key → Sleeper TEAM_* season-stat field (higher = better rank 1).
          FIELDS = [
              ("offense", "off_yd"),
              ("passAtt", "pass_att"),
              ("passYd", "pass_yd"),
              ("passTd", "pass_td"),
              ("td", "td"),
              ("rz", "rz_att"),
              ("rzPct", "rz_pct"),
          ]

          def get(url: str):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as res:
                  return json.load(res)

          def competition_ranks(rows: list[tuple[str, float]]) -> dict[str, int]:
              """1-based competition ranking (ties share, next skips)."""
              rows = sorted(rows, key=lambda x: (-x[1], x[0]))
              out: dict[str, int] = {}
              i = 0
              while i < len(rows):
                  j = i
                  while j < len(rows) and rows[j][1] == rows[i][1]:
                      j += 1
                  rank = i + 1
                  for k in range(i, j):
                      out[rows[k][0]] = rank
                  i = j
              return out

          state = get("https://api.sleeper.app/v1/state/nfl")
          season = str(state.get("league_season") or state.get("season") or datetime.datetime.utcnow().year)
          raw = get(f"https://api.sleeper.app/v1/stats/nfl/regular/{season}")

          team_stats: dict[str, dict] = {}
          if isinstance(raw, dict):
              for key, st in raw.items():
                  if not str(key).startswith("TEAM_") or not isinstance(st, dict):
                      continue
                  abbr = str(key).removeprefix("TEAM_").strip().upper()
                  if abbr == "WSH":
                      abbr = "WAS"
                  if abbr:
                      team_stats[abbr] = st

          if len(team_stats) < 28:
              raise SystemExit(f"too few TEAM_* rows: {len(team_stats)}")

          ranked: dict[str, dict[str, int]] = {abbr: {} for abbr in team_stats}
          for chip, field in FIELDS:
              rows = [(abbr, float(st.get(field) or 0)) for abbr, st in team_stats.items()]
              for abbr, rank in competition_ranks(rows).items():
                  ranked[abbr][chip] = rank

          payload = {
              "season": int(season) if season.isdigit() else season,
              "updatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "source": "sleeper-team-season-stats",
              "teams": ranked,
          }
          Path("/tmp/nfl-team-offense-ranks.json").write_text(
              json.dumps(payload, separators=(",", ":"))
          )
          Path("/tmp/nfl-team-offense-meta.env").write_text(f"SEASON={season}\n")
          print(f"season={season} teams={len(ranked)} source=sleeper-team-season-stats")
          PY
          # shellcheck disable=SC1091
          source /tmp/nfl-team-offense-meta.env
          echo "season=$SEASON" >> "$GITHUB_OUTPUT"

      - name: Update snap-cdn file
        env:
          SEASON: ${{ steps.build.outputs.season }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          DEST="snap/nfl-team-offense-ranks-${SEASON}.json"
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$REMOTE" snap-cdn >/dev/null 2>&1; then
            git fetch --depth=1 "$REMOTE" snap-cdn
            git checkout -q FETCH_HEAD
            git checkout -q -B snap-cdn
          else
            git checkout -q -b snap-cdn
            touch .nojekyll
            echo "# Snap CDN" > README.md
          fi
          mkdir -p snap
          cp /tmp/nfl-team-offense-ranks.json "$DEST"
          git add -A
          if git diff --cached --quiet; then
            echo "No content change — skip push."
            exit 0
          fi
          git commit -q -m "NFL team offense ranks (Sleeper) ${SEASON} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force "$REMOTE" snap-cdn
          echo "Published ${DEST}"
