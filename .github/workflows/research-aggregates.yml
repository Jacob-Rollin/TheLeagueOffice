name: Research Aggregates Warm

# Precomputes nflverse / club-scrape research payloads into TiDB so request
# paths never gunzip PBP or crawl 32 club sites. Hits Vercel cron only.
# Kept to 1–2 runs/day to protect Vercel Hobby Fluid CPU; daily Vercel cron
# at 07:00 remains the backup.

on:
  schedule:
    # Morning warm (after Vercel 07:00 backup window) — all days including Saturday.
    - cron: "15 8 * * *"
    # Evening refresh on gamedays (Sun/Mon/Thu) for injury designations.
    - cron: "15 19 * * 0,1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-aggregates
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger research aggregates cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          BASE="${APP_URL%/}"
          case "$BASE" in
            http://theleagueoffice.app|https://theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
            http://www.theleagueoffice.app) BASE="https://www.theleagueoffice.app" ;;
          esac
          curl -fsSL -H "Authorization: Bearer $CRON_SECRET" \
            "$BASE/api/cron/research-aggregates"

      - name: Log Success to Axiom
        if: success()
        run: |
          curl -X POST "https://api.axiom.co/v1/datasets/the-league-office/ingest" \
            -H "Authorization: Bearer ${{ secrets.AXIOM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "event_source": "github_actions",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "status": "success",
              "msg": "Research aggregates warmed into TiDB."
            }]'

      - name: Log Failure to Axiom
        if: failure()
        run: |
          curl -X POST "https://api.axiom.co/v1/datasets/the-league-office/ingest" \
            -H "Authorization: Bearer ${{ secrets.AXIOM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "event_source": "github_actions",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "status": "failed",
              "msg": "Research aggregates warm failed."
            }]'
