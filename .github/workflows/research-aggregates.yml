name: Research Aggregates Warm

# Precomputes nflverse / club-scrape research payloads into TiDB so request
# paths never gunzip PBP or crawl 32 club sites. Hits Vercel cron only.

on:
  schedule:
    # Mid-week every 3 hours (Tue–Wed).
    - cron: "30 */3 * * 2,3"
    # Gameday: hourly during active windows.
    - cron: "10 12-23 * * 0,1,4"
    - cron: "10 0-5 * * 1,2,5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-aggregates
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Trigger research aggregates cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET not configured — skipping."
            exit 0
          fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/research-aggregates"

      - name: Log Success to Axiom
        if: success()
        run: |
          curl -X POST "https://api.axiom.co/v1/datasets/the-league-office/ingest" \
            -H "Authorization: Bearer ${{ secrets.AXIOM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "event_source": "github_actions",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "status": "success",
              "msg": "Research aggregates warmed into TiDB."
            }]'

      - name: Log Failure to Axiom
        if: failure()
        run: |
          curl -X POST "https://api.axiom.co/v1/datasets/the-league-office/ingest" \
            -H "Authorization: Bearer ${{ secrets.AXIOM_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '[{
              "event_source": "github_actions",
              "workflow": "${{ github.workflow }}",
              "run_id": "${{ github.run_id }}",
              "status": "failed",
              "msg": "Research aggregates warm failed."
            }]'
