name: Weekly Front Office Desk — Start/Sit (retired)

# Start/Sit CMS desks are no longer published to the homepage.
# Kept as a disabled workflow so Actions history remains discoverable.
# Waiver wire remains on weekly-desk.yml (Tue 9:00 UTC).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE to temporarily re-run (no-op by default)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: weekly-desk-startsit
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Start/Sit desk retired
        run: |
          echo "Start/Sit weekly desk publishing is retired."
          echo "Homepage Front Office feed only auto-publishes Waiver Wire."
          if [ "${{ inputs.confirm }}" = "ENABLE" ]; then
            echo "ENABLE acknowledged, but start-sit publish remains disabled in app code."
          fi
          exit 0
